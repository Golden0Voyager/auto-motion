[project]
name = "auto_motion"
version = "0.1.0"
description = "Agnes AI 图像与视频生成实验脚手架 (auto_motion)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "flask>=3.0.0",
]

[project.scripts]
auto-motion = "main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
